name: mobile_app_for_shops
description: A Flutter mobile application for shop management with offline-first capabilities and cloud sync.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase & Cloud
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  cloud_firestore: ^4.13.0

  # State Management
  provider: ^6.1.0

  # Offline & Sync
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  connectivity_plus: ^5.0.0

  # UI & Navigation
  flutter_launcher_icons: ^0.13.1
  page_transition: ^2.1.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  shared_preferences: ^2.2.0
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
